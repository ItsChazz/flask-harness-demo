pipeline:
  name: Flask App CI/CD
  identifier: flask_app_cicd
  projectIdentifier: default
  orgIdentifier: default
  tags: {}
  stages:
    - stage:
        name: Build and Test
        identifier: build_and_test
        type: CI
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: account.harnessImage
              namespace: harness-delegate-ng
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Install Dependencies
                  identifier: install_dependencies
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.9-slim
                    shell: Sh
                    command: |
                      pip install -r requirements.txt
              - step:
                  type: Run
                  name: Run Tests
                  identifier: run_tests
                  spec:
                    connectorRef: account.harnessImage
                    image: python:3.9-slim
                    shell: Sh
                    command: |
                      pip install -r requirements.txt
                      pytest test_app.py -v
              - step:
                  type: BuildAndPushDockerRegistry
                  name: Build and Push Docker Image
                  identifier: build_and_push
                  spec:
                    connectorRef: <+input>
                    repo: chazz801/flask-harness-demo
                    tags:
                      - latest
                      - <+pipeline.sequenceId>
                    dockerfile: dockerfile
    - stage:
        name: Deploy to Kubernetes
        identifier: deploy_to_k8s
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: flask_app_service
          environment:
            environmentRef: dev
            deployToAll: false
            infrastructureDefinitions:
              - identifier: k8s_infra
          execution:
            steps:
              - step:
                  type: K8sApply
                  name: Apply Kubernetes Manifests
                  identifier: apply_manifests
                  spec:
                    filePaths:
                      - k8s/namespace.yaml
                      - k8s/deployment.yaml
                      - k8s/service.yaml
                    skipDryRun: false
              - step:
                  type: K8sRollingDeploy
                  name: Rolling Deployment
                  identifier: rolling_deploy
                  spec:
                    skipDryRun: false
  properties:
    ci:
      codebase:
        connectorRef: <+input>
        repoName: flask-harness-demo
        build: <+input>
        detectBuildTool: false
